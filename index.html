<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Escarabajo Glorioso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" id="defs"></svg>
  <div class="bar" id="bar"></div>
  <nav id="nav" aria-label="Escenas"></nav>
  <svg id="trail" aria-hidden="true"><defs><clipPath id="trailClip"><rect id="trailRect" x="0" y="0" width="90" height="0"/></clipPath></defs><g id="prints" clip-path="url(#trailClip)" fill="var(--track)"></g></svg>
  <svg id="buddy" aria-hidden="true"><g id="buddyG"></g></svg>
  <main>
    <section class="sec" id="s2" aria-label="Vuelo">
      <div class="stage">
        <header class="h"><div class="k"><b>01</b><span>/ 03</span><i>Chrysina gloriosa</i></div><h2>Abre las alas y <em>vuela</em></h2></header>
        <svg class="b" viewBox="-230 -230 460 460"></svg>
      </div>
    </section>
    <section class="sec" id="s3" aria-label="Brillo">
      <div class="stage">
        <header class="h"><div class="k"><b>02</b><span>/ 03</span><i>Chrysina gloriosa</i></div><h2>La luz lo <em>recorre</em></h2></header>
        <svg class="b" viewBox="-230 -230 460 460"></svg>
      </div>
    </section>
    <section class="sec" id="s5" aria-label="Camina">
      <div class="stage">
        <header class="h"><div class="k"><b>03</b><span>/ 03</span><i>Chrysina gloriosa</i></div><h2><em>Camina</em></h2></header>
        <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"></svg>
      </div>
    </section>
    <div class="end"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
